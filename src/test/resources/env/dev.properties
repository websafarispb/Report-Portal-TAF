com.reportportal.ta.ui.env=DEV
com.reportportal.ta.ui.url=http://host.docker.internal:8080/
com.reportportal.ta.ui.run.remote=false
# if taf will be run in container com.reportportal.ta.ui.selenoid.url=http://selenoid:4444
com.reportportal.ta.ui.selenoid.url=http://localhost:4444
com.reportportal.ta.ui.selenoid.enable.vnc=false
com.reportportal.ta.ui.selenoid.enable.video=false

# browser names: chrome, firefox, chrome_selenoid, firefox_selenoid
com.reportportal.ta.ui.browser.name=chrome_selenoid
com.reportportal.ta.ui.webdriver.explicit.timeout.millis=30000
com.reportportal.ta.ui.wait.for.selenoid.video.millis=30000

path.to.download.folder=/downloads
